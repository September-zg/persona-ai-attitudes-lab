<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清理演示数据</title><style>body{font-family:system-ui;max-width:600px;margin:60px auto;padding:20px}button{padding:12px 18px;border:0;border-radius:8px;background:#315efb;color:white;font-size:16px}</style><h1>清理本机演示数据</h1><p>此页面只清除当前浏览器中本测评的本地演示记录，不会删除项目代码。</p><button id="clear">清空并返回测评</button><p id="status"></p><script>document.querySelector('#clear').onclick=()=>{localStorage.removeItem('assessmentResponses');localStorage.removeItem('assessmentFeedback');document.querySelector('#status').textContent='已清空，即将返回测评页面。';setTimeout(()=>location.href='index.html',600)}</script></html>
